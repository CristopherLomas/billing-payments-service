server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: billing-payments-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Payments_DB;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Payments_2026!Secure}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        serialization-mode: via-dto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

integration:
  mock: ${INTEGRATION_MOCK:true}
  qr-service-url: ${QR_SERVICE_URL:http://localhost:8080}
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}
  trips-service-url: ${TRIPS_SERVICE_URL:http://10.10.10.13:5001}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwks-uri: ${JWT_JWKS_URI:http://10.10.10.5:5001/.well-known/jwks.json}
    dev-mode: ${JWT_DEV_MODE:true}
