services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payments-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Payments_2026!Secure}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/init-db.sql:/docker/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Payments_2026!Secure}\" -Q \"SELECT 1\" -b -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &
      pid=$$!;
      echo 'Esperando que SQL Server inicie para ejecutar init-db.sql...';
      for i in {1..60}; do
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Payments_2026!Secure}\" -Q 'SELECT 1' -b -C > /dev/null 2>&1;
        if [ $$? -eq 0 ]; then
          echo 'SQL Server activo. Ejecutando docker/init-db.sql...';
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Payments_2026!Secure}\" -i /docker/init-db.sql -b -C;
          echo 'Base de datos Payments_DB inicializada correctamente.';
          break;
        fi;
        sleep 2;
      done;
      wait $$pid
      "
    networks:
      - payments-network
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payments-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Payments_2026!Secure}"
    volumes:
      - ./docker/init-db.sql:/docker/init-db.sql:ro
    command: >
      /bin/bash -c "
      echo 'Contenedor auxiliar: Verificando e inicializando base de datos...';
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD:-Payments_2026!Secure}\" -i /docker/init-db.sql -b -C;
      echo 'Contenedor auxiliar: Inicialización completada exitosamente.';
      "
    networks:
      - payments-network
    restart: "no"

  billing-payments-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing-payments-service
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8085}:8085"
    environment:
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=Payments_DB;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-Payments_2026!Secure}"
      INTEGRATION_MOCK: "${INTEGRATION_MOCK:-true}"
      QR_SERVICE_URL: "${QR_SERVICE_URL:-http://qr-service:8081}"
      BOOKING_SERVICE_URL: "${BOOKING_SERVICE_URL:-http://booking-service:8082}"
      TRIPS_SERVICE_URL: "${TRIPS_SERVICE_URL:-http://10.10.10.13:5001}"
      JWT_SECRET: "${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}"
      JWT_JWKS_URI: "${JWT_JWKS_URI:-http://10.10.10.5:5001/.well-known/jwks.json}"
      JWT_DEV_MODE: "${JWT_DEV_MODE:-true}"
    networks:
      - payments-network
    restart: unless-stopped

networks:
  payments-network:
    name: payments-network
    driver: bridge

volumes:
  sqlserver_data:
    name: payments_sqlserver_data
